services:
  librimind:
    image: librimind
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        VITE_API_URL: ""
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      STATIC_DIR: /app/static
